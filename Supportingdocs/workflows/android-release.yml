name: Android Release Build

# Trigger this workflow every time you push code to the 'main' branch
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest # Uses a clean cloud Linux server

    steps:
      # 1. Pull down your source code onto the cloud server
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up the exact Java version required by Gradle
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Set up the latest stable Flutter SDK framework
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Re-create your secret keystore file dynamically from GitHub Secrets
      - name: Decode Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      # 5. Re-create your secret key.properties file dynamically
      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../release-keystore.jks" >> android/key.properties

      # 6. Fetch Flutter application packages
      - name: Install dependencies
        run: flutter pub get

      # 7. Compile BOTH the official bundle AND the test APK
      - name: Build App Bundle and APK
        run: |
          flutter build appbundle --release
          flutter build apk --release

      # 8. Upload both finished files back to GitHub 
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: play-store-builds
          path: |
            build/app/outputs/bundle/release/app.aab
            build/app/outputs/flutter-apk/app-release.apk

