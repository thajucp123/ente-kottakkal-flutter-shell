name: ente_kottakkal_flutter_shell
description: A fullscreen Flutter WebView shell with splash screen and page loader.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^18.0.1
  share_plus: ^10.1.4
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  vibration: ^2.0.1
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#101820"
  image: logo.png
  image_dark: logo.png
  android: true
  ios: true
  web: false
  fullscreen: false

flutter_launcher_icons:
  android: true
  ios: true
  image_path: logo.png
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: logo.png
